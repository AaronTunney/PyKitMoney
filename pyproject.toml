[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pykitmoney"
version = "1.0.0"
description = "Display Starling Kite information on an e-paper display connected to a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Aaron Tunney", email = "aaron@example.com"}
]
keywords = ["starling", "kite", "e-paper", "raspberry-pi", "banking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "certifi>=2024.12.14",
    "charset-normalizer>=3.4.0",
    "idna>=3.10",
    "pillow>=11.0.0",
    "pytz>=2024.2",
    "requests>=2.32.3",
    "urllib3>=2.2.3",
]

[project.optional-dependencies]
pi = [
    "waveshare-epaper>=1.3.0",
    "gpiozero>=2.0.1",
    "lgpio>=0.2.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "pylint>=3.0.0",
    "mypy>=1.5.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
]

[project.scripts]
pykitmoney = "pykitmoney.main:main"

[project.urls]
Homepage = "https://github.com/AaronTunney/PyKitMoney"
Repository = "https://github.com/AaronTunney/PyKitMoney"
Issues = "https://github.com/AaronTunney/PyKitMoney/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pykitmoney*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=pykitmoney",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
